# ============================================================
# 生化危机（Biohazard）插件配置
# 丧尸（zombie:zombie_*）杀死生物后，在死者位置生成一只新的丧尸。
# 修改后重启服务器（或在游戏内执行 /reload）生效。
# ============================================================

# 击杀者判定：击杀者的实体 ID 命中以下任一模式（支持 * 通配符）时视为“丧尸类”
killer_patterns = ["zombie:zombie_*"]

# 玩家被丧尸咬死时是否也生成丧尸（玩家本体不受影响，照常重生）
include_players = true

# 永不转化的受害者实体 ID（默认排除模组自己的丧尸，防止丧尸互相击杀导致无限增殖），支持 * 通配符
excluded_victims = ["zombie:zombie_*"]

# 视为“人形生物”的受害者实体 ID：命中者抽取 [pools.humanoid]，其余所有生物抽取 [pools.default]
humanoid_victims = [
    "minecraft:villager",
    "minecraft:villager_v2",
    "minecraft:wandering_trader",
    "minecraft:piglin",
    "minecraft:piglin_brute",
    "minecraft:zombie_pigman",
    "minecraft:pillager",
    "minecraft:vindicator",
    "minecraft:evoker",
    "minecraft:illusioner",
    "minecraft:witch",
    "minecraft:zombie",
    "minecraft:husk",
    "minecraft:drowned",
    "minecraft:zombie_villager",
    "minecraft:zombie_villager_v2",
    "minecraft:skeleton",
    "minecraft:stray",
    "minecraft:wither_skeleton",
    "minecraft:bogged",
]

# ------------------------------------------------------------------
# 随机池：实体 ID = 权重（权重必须大于 0）
# ------------------------------------------------------------------

# 默认池：丧尸咬死任意生物（人形除外）时从中抽取
[pools.default]
"zombie:zombie_wolf" = 10        # 狼尸
"zombie:zombie_wolf_elita" = 5   # 精英狼尸
"zombie:zombie_spider" = 10      # 蜘蛛尸
"zombie:zombie_spider_giant" = 1 # 巨型蜘蛛尸

# 人形池：人形生物（村民、猪灵等）被丧尸杀死时从中抽取，按强度指定权重
[pools.humanoid]
# 基础（权重 10）
"zombie:zombie" = 10             # 普通尸
"zombie:zombie_withered" = 10    # 枯尸
"zombie:zombie_spit" = 10        # 喷吐尸
"zombie:zombie_mutant" = 10      # 变种尸
# 强化人形（权重 5）
"zombie:zombie_conscript" = 5    # 列兵
"zombie:zombie_butcher" = 5      # 屠夫
"zombie:zombie_marauder" = 5     # 掠夺者
"zombie:zombie_adapted" = 5      # 适应者
"zombie:zombie_executioner" = 5  # 刽子手
"zombie:zombie_defiler" = 5      # 污染者
"zombie:zombie_longarms" = 5     # 长臂
"zombie:zombie_jumper" = 5       # 跳尸
"zombie:zombie_runner" = 5       # 疾行尸
"zombie:zombie_screamer" = 5     # 尖叫尸
"zombie:zombie_fat" = 5          # 肥尸
# 精英（权重 3）——狼尸/蜘蛛尸系已划入默认池，精英档只剩猎手系
"zombie:zombie_hunter" = 3       # 猎手
"zombie:zombie_hunter_elita" = 3 # 精英猎手
# BOSS（权重 1）
"zombie:zombie_giant" = 1        # 巨人尸
"zombie:zombie_nemesis_1" = 1    # 复仇女神 1
"zombie:zombie_nemesis_2" = 1    # 复仇女神 2
"zombie:zombie_tyrant" = 1       # 暴君
"zombie:zombie_death_lord" = 1   # 死亡领主
